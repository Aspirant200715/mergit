# Render Blueprint: the two static sites only, which are free and need no card.
#
# NOT LIVE since 2026-10-30: mergit.site, www and app.mergit.site are served from the Hetzner server (see
# deploy/server/README.md). Their DNS points there. This file is kept as the rollback path only: to use it,
# point the DNS records back at Render first.
#
# mergit-web is the public site at mergit.site: the design over mock data (frontend/src/mock), unchanged.
# mergit-app is the same frontend on live data at app.mergit.site, on Base Sepolia testnet money only.
# The Rust services (store, validator, gateway), Postgres and the agent worker need disks and an always-on
# process, so they run from deploy/compose.testnet.yaml on one machine (a laptop now, one Hetzner server
# after the OSC reimbursement). Render's paid versions of them are kept in git history (commit d806317).
services:
  - type: web
    runtime: static
    name: mergit-web
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeploy: true
    domains:
      - mergit.site
      - www.mergit.site
    envVars:
      # package.json requires node >=22.12; Render's default may be older.
      - key: NODE_VERSION
        value: 22.12.0
    routes:
      # The app uses createBrowserRouter, so /app and /app/proofs must resolve to index.html
      # or a direct visit or a refresh returns 404.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable

  - type: web
    runtime: static
    name: mergit-app
    rootDir: frontend
    buildCommand: bash scripts/build-wasm.sh && npm ci && npm run build
    buildFilter:
      paths: ["frontend/**", "verifier/**", "spec/**"]
    staticPublishPath: dist
    autoDeploy: true
    domains:
      - app.mergit.site
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: VITE_DATA_MODE
        value: live
      - key: VITE_CHAIN_ID
        value: "84532"
      - key: VITE_CHAIN_NAME
        value: Base Sepolia
      - key: VITE_RPC_URL
        value: https://sepolia.base.org
      - key: VITE_USDC
        value: "0x036CbD53842c5426634e7929541eC2318f3dCF7e"
      # From deployments/base-sepolia.json and the service URLs below, set after the first deploy.
      - key: VITE_API_URL
        sync: false
      - key: VITE_GATEWAY_URL
        sync: false
      - key: VITE_STORE_URL
        sync: false
      - key: VITE_ESCROW
        sync: false
      - key: VITE_RECEIPT_REGISTRY
        sync: false
      - key: VITE_IDENTITY
        sync: false
      - key: VITE_DEPLOY_BLOCK
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
