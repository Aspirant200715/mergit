[package]
name = "mergit-verifier-wasm"
edition.workspace = true
license.workspace = true
version.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
mergit-spec.workspace = true
mergit-verifier.workspace = true
alloy-primitives.workspace = true
serde_json.workspace = true
serde.workspace = true
wasm-bindgen = "0.2"

# k256 (via alloy-primitives) pulls getrandom 0.2, which refuses wasm32-unknown-unknown without its `js` backend.
# Verification never draws randomness; this only lets the crate build for the browser.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[dev-dependencies]
wasm-bindgen-test = "0.3"
